name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32s3dev
          - esp32s2dev
          - esp32s3hil
          - esp32s3hil_persistence

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Check generated version header
        run: python scripts/generate_version.py check

      - name: Check core portability contracts
        run: python tools/check_portability.py

      - name: Run native tests
        run: pio test -e native

  esp-idf-basic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3, esp32s2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the native example
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v6.0.1
          target: ${{ matrix.target }}
          path: examples/esp_idf/basic
          command: idf.py set-target ${{ matrix.target }} build

      - name: Upload ESP-IDF build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp-idf-build-logs-${{ matrix.target }}
          path: |
            examples/esp_idf/basic/build/**/*.log
            examples/esp_idf/basic/build/log/**
          if-no-files-found: ignore

  validate-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Check public ABI contracts
        run: python tools/check_abi.py

      - name: Test contract checker regression detection
        run: python -m unittest discover -s tools -p 'test_check_*.py'

      - name: Check device-free HIL tooling
        run: |
          python -S tools/hil_cli_runner.py --parser-self-test
          python -S tools/test_hil_cli_runner.py
          python -S tools/test_hil_health_snapshot.py
          python -S tools/hil_cli_runner.py --dry-run

      - name: Check source and package metadata
        run: python tools/check_package.py source

      - name: Check native ESP-IDF example and CI contracts
        run: python tools/check_idf_example_contract.py

      - name: Build public documentation
        run: doxygen Doxyfile

      - name: Validate library package
        run: |
          mkdir -p dist
          pio pkg pack -o dist/RV3032-C7.tar.gz .
          python tools/check_package.py package dist/RV3032-C7.tar.gz

      - name: Upload validated library package
        uses: actions/upload-artifact@v4
        with:
          name: rv3032-library-package
          path: dist/RV3032-C7.tar.gz
          if-no-files-found: error

  esp-idf-package:
    needs: validate-library
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3, esp32s2]
    steps:
      - name: Download validated library package
        uses: actions/download-artifact@v4
        with:
          name: rv3032-library-package
          path: ${{ github.workspace }}

      - name: Extract the package for the consumer build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pkg/RV3032"
          tar -xzf RV3032-C7.tar.gz -C "$GITHUB_WORKSPACE/pkg/RV3032"
          test -f pkg/RV3032/CMakeLists.txt
          test -f pkg/RV3032/examples/esp_idf/basic/CMakeLists.txt

      - name: Build the packaged native example
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v6.0.1
          target: ${{ matrix.target }}
          path: pkg/RV3032/examples/esp_idf/basic
          command: idf.py set-target ${{ matrix.target }} build

      - name: Verify archive build identity
        working-directory: pkg/RV3032/examples/esp_idf/basic/build/esp-idf/main
        run: |
          grep -Fx 'inline constexpr char COMMIT[] = "unknown";' Rv3032BuildIdentity.h
          grep -Fx 'inline constexpr char STATUS[] = "unknown";' Rv3032BuildIdentity.h
