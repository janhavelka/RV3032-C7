name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32s3dev
          - esp32s2dev
          - esp32s3hil
          - esp32s3hil_persistence

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Check generated version header
        run: python scripts/generate_version.py check

      - name: Check core portability contracts
        run: python tools/check_portability.py

      - name: Run native tests
        run: pio test -e native

  validate-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Check public ABI contracts
        run: python tools/check_abi.py

      - name: Test contract checker regression detection
        run: python -m unittest discover -s tools -p 'test_check_*.py'

      - name: Check device-free HIL tooling
        run: |
          python -S tools/hil_cli_runner.py --parser-self-test
          python -S tools/test_hil_cli_runner.py
          python -S tools/test_hil_health_snapshot.py
          python -S tools/hil_cli_runner.py --dry-run

      - name: Check source and package metadata
        run: python tools/check_package.py source

      - name: Build public documentation
        run: doxygen Doxyfile

      - name: Validate library package
        run: |
          mkdir -p dist
          pio pkg pack -o dist/RV3032-C7.tar.gz .
          python tools/check_package.py package dist/RV3032-C7.tar.gz
