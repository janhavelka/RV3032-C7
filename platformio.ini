[platformio]
src_dir = .
default_envs = esp32s3dev

[dependency_pins]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

[env]
platform = ${dependency_pins.platform}
framework = arduino
extra_scripts = pre:scripts/generate_version.py

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = send_on_enter, esp32_exception_decoder, colorize
monitor_eol = LF
monitor_echo = yes

upload_speed = 921600

build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Werror=return-type
  -Iinclude
  -Iexamples
  -DCORE_DEBUG_LEVEL=0
  -DLOG_LEVEL=2

build_src_filter =
  -<*>
  +<examples/01_basic_bringup_cli/**>
  +<examples/common/**>
  +<src/**>
  +<include/**>

; ESP-PROG / ESP-PROG2
debug_tool = esp-prog
debug_init_break = tbreak setup

; -------------------------
; ESP32-S3 dev config
; -------------------------
[env:esp32s3dev]
extends = env
board = esp32-s3-devkitc1-n16r8
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; -------------------------
; ESP32-S3 exhaustive hardware-in-the-loop harness
; -------------------------
[env:esp32s3hil]
extends = env:esp32s3dev
build_src_filter =
  -<*>
  +<test/test_hil/**>
  +<src/**>
  +<include/**>

; -------------------------
; ESP32-S3 configuration EEPROM power-cycle HIL harness
; -------------------------
[env:esp32s3hil_persistence]
extends = env:esp32s3dev
build_src_filter =
  -<*>
  +<test/test_hil_persistence/**>
  +<src/**>
  +<include/**>

; -------------------------
; ESP32-S2 dev config
; -------------------------
[env:esp32s2dev]
extends = env
board = esp32-s2-saola-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_upload.after_reset = no_reset_stub
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1

; -------------------------
; Host unit tests (does NOT extend [env] - native platform)
; -------------------------
[env:native]
platform = native
framework =
extra_scripts = pre:scripts/generate_version.py
test_framework = unity
test_filter = test_native
test_build_src = true
build_flags =
  -std=c++17
  -I.
  -Iinclude
  -Itest/stubs
  -DARDUINO=100
  ; The native Wire/Arduino stubs model the ESP32 example adapter API.
  -DARDUINO_ARCH_ESP32
build_src_filter =
  -<*>
  +<src/**>
