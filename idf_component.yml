version: "3.1.0"
description: "RV-3032-C7 real-time clock driver with battery backup, alarms, temperature sensing and cooperative EEPROM persistence."
license: "MIT"
maintainers:
  - "Jan Havelka (THYMOS Solution s.r.o.) <info@thymos.cz>"
url: "https://github.com/janhavelka/RV3032-C7"
repository: "https://github.com/janhavelka/RV3032-C7.git"
targets:
  - "esp32s2"
  - "esp32s3"
dependencies:
  idf: ">=6.0.1"
files:
  exclude:
    - ".github/**/*"
    - ".pio/**/*"
    - ".venv/**/*"
    - ".vscode/**/*"
    - "dist/**/*"
    - "AGENTS.md"
    - "docs/CODE_AUDIT*.md"
    - "docs/doxygen/**/*"
    - "docs/extracted-md/**/*"
    - "docs/prompts/**/*"
    - "docs/reports/**/*"
    - "examples/**/build*/**/*"
    - "examples/**/managed_components/**/*"
    - "examples/**/dependencies.lock"
    - "examples/**/sdkconfig"
    - "examples/**/sdkconfig.old"
    - "examples/**/sdkconfig.esp32*"
    - "idf_component.yml.orig"
    - "tmp/**/*"
    - "docs/reference-pdfs/**/*"
    - "docs/**/*.pdf"
    - "test/**/*"
    - "*.tar.gz"
    - "*.tgz"
    - "*.zip"
